<!DOCTYPE html>
<html>
    <head>
        <style>
            body {
                background-image: url('Background.png');
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                background-attachment: fixed;
                margin: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
            }

            h1 {
                position: absolute;
                top: 40px;
                left: 0;
                right: 0;
                text-align: center;
                font-size: 4.0em;
            }

            .button {
                padding: 24px 56px;
                border: none;
                border-radius: 12px;
                background: radial-gradient(circle at center, #ffffff 0%, #3b82f6 100%);
                color: #1e3a8a;
                font-weight: 600;
                font-size: 28px;
                cursor: pointer;
                box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
                transition: transform 0.15s ease;
                width: 340px;
            }

            .button:hover {
                transform: scale(1.05);
            }

            /* Overlay menu */
            .overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.55);
                align-items: center;
                justify-content: center;
                flex-direction: column;
                z-index: 10;
            }

            .overlay.active {
                display: flex;
            }

            .menu-panel {
                background-image: url('PanelBackground.png');
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                border-radius: 16px;
                padding: 40px 64px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 20px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
                width: 380px;
            }

            .menu-panel h2 {
                margin: 0 0 10px 0;
                color: #1e3a8a;
                text-shadow: 0 1px 4px rgba(255, 255, 255, 0.8);
            }

            .menu-button {
                padding: 16px 40px;
                border: none;
                border-radius: 8px;
                background: radial-gradient(circle at center, #ffffff 0%, #3b82f6 100%);
                color: #1e3a8a;
                font-weight: 600;
                font-size: 18px;
                cursor: pointer;
                box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
                width: 300px;
            }

            .close-button {
                margin-top: 10px;
                background: none;
                border: none;
                color: #666;
                cursor: pointer;
                font-size: 14px;
                text-decoration: underline;
            }

            /* Mute button */
            .mute-button {
                position: fixed;
                bottom: 20px;
                right: 20px;
                width: 48px;
                height: 48px;
                border: none;
                border-radius: 50%;
                background: rgba(0, 0, 0, 0.5);
                color: #fff;
                font-size: 20px;
                cursor: pointer;
                z-index: 20;
            }
        </style>
    </head>
    <body>
        <h1>
            58's Modding Hub!
        </h1>

        <button class="button" onclick="document.getElementById('menuOverlay').classList.add('active')">
            58's Soundboard
        </button>

        <div class="overlay" id="menuOverlay">
            <div class="menu-panel">
                <h2>Choose an option</h2>
                <button class="menu-button" onclick="alert('Not Added Yet!')">Tutorial (WIP)</button>
                <button class="menu-button" onclick="window.open('https://threethan.itch.io/lightning-launcher', '_blank')">Lightning Launcher</button>
                <button class="menu-button" onclick="alert('Not Added Yet!')">Soundboard (WIP)</button>
                <button class="close-button" onclick="document.getElementById('menuOverlay').classList.remove('active')">Close</button>
            </div>
        </div>

        <!-- Background music -->
        <audio id="bgMusic" src="BackgroundMusic.mp3" loop></audio>
        <button class="mute-button" id="muteButton" onclick="toggleMute()">🔊</button>

        <script>
            const bgMusic = document.getElementById('bgMusic');
            const muteButton = document.getElementById('muteButton');

            // Try to autoplay immediately (works in some browsers/contexts)
            bgMusic.play().catch(() => {
                // Autoplay was blocked; start on the first user interaction instead
                const startOnInteraction = () => {
                    bgMusic.play();
                    document.removeEventListener('click', startOnInteraction);
                    document.removeEventListener('keydown', startOnInteraction);
                };
                document.addEventListener('click', startOnInteraction);
                document.addEventListener('keydown', startOnInteraction);
            });

            function toggleMute() {
                bgMusic.muted = !bgMusic.muted;
                muteButton.textContent = bgMusic.muted ? '🔇' : '🔊';
            }
        </script>
    </body>
</html>
